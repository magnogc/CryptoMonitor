name: Import v0.3.2 project folders

on:
  push:
    paths:
      - '.import_v032/**'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild v0.3.2 package
        shell: bash
        run: |
          cat .import_v032/part* > /tmp/v032.b64
          base64 -d /tmp/v032.b64 > /tmp/v032.zip
          rm -rf /tmp/v032
          mkdir -p /tmp/v032
          unzip -q /tmp/v032.zip -d /tmp/v032
          cp -a /tmp/v032/v4_dashboard_v0_3/. .
          rm -rf data/cache
          rm -rf .import_v032

      - name: Commit imported folders
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import complete v0.3.2 project folders"
          git push
